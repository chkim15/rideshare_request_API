
    <!DOCTYPE html>
    <html>
    <head>

        <meta name="viewport" content="initial-scale=1.0">
        <meta charset="utf-8">
        <style>
            #map {
                height: 100%;
                width: 100%;
                position: absolute;
                top: 0;
                left: 0;
                z-index: 0;
            }
            html, body {
                height: 100%;
                margin: 0;
                padding: 0;
            }
            .info-panel {
                position: absolute;
                top: 10px;
                left: 10px;
                z-index: 1;
                background-color: white;
                padding: 10px;
                border-radius: 5px;
                box-shadow: 0 2px 6px rgba(0,0,0,.3);
                max-height: 80%;
                overflow-y: auto;
                max-width: 300px;
            }
            .location {
                margin-bottom: 10px;
                border-bottom: 1px solid #eee;
                padding-bottom: 5px;
            }
            .high-income {
                color: green;
                font-weight: bold;
            }
            .random {
                color: blue;
                font-weight: bold;
            }
        </style>
    </head>

            function initMap() {
                var bounds = new google.maps.LatLngBounds();
                var map = new google.maps.Map(document.getElementById('map'), {
                    zoom: 12
                });
                
                var infoWindow = new google.maps.InfoWindow();
                var locationsList = document.getElementById('locations-list');
                
                // Add markers for high income places
                var highIncomeLocations = locations.filter(loc => loc.type === 'high_income');
                for (var i = 0; i < highIncomeLocations.length; i++) {
                    var location = highIncomeLocations[i];
                    var marker = new google.maps.Marker({
                        position: { lat: location.lat, lng: location.lng },
                        map: map,
                        title: location.name,
                        icon: 'http://maps.google.com/mapfiles/ms/icons/green-dot.png'
                    });
                    
                    bounds.extend(marker.getPosition());
                    
                    // Add info window 
                    (function(marker, location) {
                        google.maps.event.addListener(marker, 'click', function() {
                            infoWindow.setContent(
                                '<div><strong>' + location.name + '</strong><br>' +
                                'Type: High Income<br>' +
                                'Lat: ' + location.lat.toFixed(6) + ', Lng: ' + location.lng.toFixed(6) + '</div>'
                            );
                            infoWindow.open(map, marker);
                        });
                    })(marker, location);
                    
                    // Add to sidebar list
                    var locationDiv = document.createElement('div');
                    locationDiv.className = 'location';
                    locationDiv.innerHTML = '<div class="high-income">' + location.name + '</div>' +
                                          '<div>Lat: ' + location.lat.toFixed(6) + ', Lng: ' + location.lng.toFixed(6) + '</div>';
                    locationsList.appendChild(locationDiv);
                }
                
                // Add markers for random places
                var randomLocations = locations.filter(loc => loc.type === 'random');
                for (var i = 0; i < randomLocations.length; i++) {
                    var location = randomLocations[i];
                    var marker = new google.maps.Marker({
                        position: { lat: location.lat, lng: location.lng },
                        map: map,
                        title: location.name,
                        icon: 'http://maps.google.com/mapfiles/ms/icons/blue-dot.png'
                    });
                    
                    bounds.extend(marker.getPosition());
                    
                    // Add info window
                    (function(marker, location) {
                        google.maps.event.addListener(marker, 'click', function() {
                            infoWindow.setContent(
                                '<div><strong>' + location.name + '</strong><br>' +
                                'Type: Random<br>' +
                                'Lat: ' + location.lat.toFixed(6) + ', Lng: ' + location.lng.toFixed(6) + '</div>'
                            );
                            infoWindow.open(map, marker);
                        });
                    })(marker, location);
                    
                    // Add to sidebar list
                    var locationDiv = document.createElement('div');
                    locationDiv.className = 'location';
                    locationDiv.innerHTML = '<div class="random">' + location.name + '</div>' +
                                          '<div>Lat: ' + location.lat.toFixed(6) + ', Lng: ' + location.lng.toFixed(6) + '</div>';
                    locationsList.appendChild(locationDiv);
                }
                
                map.fitBounds(bounds);
            }
        </script>
        <script async defer
            src="https://maps.googleapis.com/maps/api/js?callback=initMap">
        </script>
    </body>
